<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#e9eee3}canvas{display:block}</style></head><body><script type="module">
import * as T from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const renderer=new T.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;document.body.append(renderer.domElement);
const scene=new T.Scene();scene.add(new T.HemisphereLight(0xffffff,0x92987c,2.0));const key=new T.DirectionalLight(0xfff8eb,2.5);key.position.set(-3,5,5);scene.add(key);const fill=new T.DirectionalLight(0xffffff,.7);fill.position.set(4,2,-2);scene.add(fill);const camera=new T.PerspectiveCamera(32,innerWidth/innerHeight,.01,50);camera.position.set(.75,1.25,4.5);camera.lookAt(0,.9,0);let current;
window.preview=async(type,yaw=0)=>{if(current)scene.remove(current);const gltf=await new GLTFLoader().loadAsync('/people/models/'+type+'.glb');const root=gltf.scene;root.rotation.y=yaw;root.updateMatrixWorld(true);const bounds=new T.Box3().setFromObject(root,true),size=bounds.getSize(new T.Vector3()),center=bounds.getCenter(new T.Vector3());const scale=1.75/size.y;root.scale.multiplyScalar(scale);root.position.set(-center.x*scale,-bounds.min.y*scale,-center.z*scale);scene.add(root);current=root;renderer.render(scene,camera);return {type,size:size.toArray(),widthRatio:size.x/size.y,depthRatio:size.z/size.y,meshes:gltf.scene.children.length,animations:gltf.animations.length};};
window.ready=true;
</script></body></html>
